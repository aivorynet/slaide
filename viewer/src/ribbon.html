<style>
/* ===== slaide viewer chrome — auto-hiding overlay ribbon ================== *
 * Injected before </body> over the engine-rendered deck. Talks to Rust via
 * window.ipc.postMessage(...) and drives the slide via the window.slaide API.
 * All ids/classes are namespaced `slv-` so they never collide with the deck's
 * own `.sl-*` classes. The chrome has its OWN colour theme (light by default —
 * mirroring the Slaide Pro web look — flipped to dark via html[data-slv-theme="dark"],
 * set from the saved `theme` pref). It still pulls the deck's --color-accent for active
 * states so it feels of-a-piece. This is app chrome, NOT slide content.          */
#slv-bar, #slv-thumbs, #slv-handle, #slv-file-menu, #slv-mon-menu, #slv-more-menu, #slv-account-menu, #slv-bstrip, #slv-chat{
  /* light (default) — warm cream paper, azure brand, ink text */
  --slv-bg:rgba(245,239,228,.85);
  --slv-bg-solid:#FBF7F0;
  --slv-line:rgba(21,18,14,.12);
  --slv-ink:#15120E;
  --slv-dim:#6B6358;
  --slv-accent:#3E6FB0;                    /* app-chrome accent is FIXED — never inherit the deck's --color-accent */
  --slv-hover:rgba(21,18,14,.06);
  --slv-active:rgba(21,18,14,.10);
  --slv-soft:rgba(21,18,14,.05);
  --slv-scroll:rgba(21,18,14,.22);
  --slv-scroll-hover:rgba(21,18,14,.34);
  --slv-press-bg:color-mix(in srgb, var(--slv-accent) 15%, transparent);
  --slv-press-ink:var(--slv-accent);
  --slv-thumb-bg:#ECE3D4;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
/* dark theme — the original chrome palette, opt-in via the saved theme pref */
html[data-slv-theme="dark"] #slv-bar, html[data-slv-theme="dark"] #slv-thumbs,
html[data-slv-theme="dark"] #slv-handle, html[data-slv-theme="dark"] #slv-file-menu,
html[data-slv-theme="dark"] #slv-mon-menu, html[data-slv-theme="dark"] #slv-more-menu,
html[data-slv-theme="dark"] #slv-account-menu, html[data-slv-theme="dark"] #slv-bstrip,
html[data-slv-theme="dark"] #slv-chat{
  --slv-bg:rgba(18,20,28,.82);
  --slv-bg-solid:#14161e;
  --slv-line:rgba(255,255,255,.08);
  --slv-ink:#e7e9f2;
  --slv-dim:#9aa0b8;
  --slv-accent:#6C8Cff;                    /* app-chrome accent is FIXED — never inherit the deck's --color-accent */
  --slv-hover:rgba(255,255,255,.09);
  --slv-active:rgba(255,255,255,.15);
  --slv-soft:rgba(255,255,255,.06);
  --slv-scroll:rgba(255,255,255,.2);
  --slv-scroll-hover:rgba(255,255,255,.34);
  --slv-press-bg:color-mix(in srgb, var(--slv-accent) 26%, transparent);
  --slv-press-ink:#fff;
  --slv-thumb-bg:#000;
}
#slv-bar *, #slv-thumbs *, #slv-file-menu *, #slv-bstrip *, #slv-chat *{ box-sizing:border-box; }

/* ---- the bar ------------------------------------------------------------- */
#slv-bar{
  position:fixed; top:0; left:0; right:0; z-index:2147483647;
  display:flex; flex-direction:column;
  background:var(--slv-bg);
  backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--slv-line);
  box-shadow:0 12px 34px -16px rgba(0,0,0,.75);
  color:var(--slv-ink);
  transform:translateY(calc(-100% - 18px));
  transition:transform .18s cubic-bezier(.4,0,.2,1);
}
body.slv-shown #slv-bar{ transform:none; }

#slv-row{ display:flex; align-items:center; gap:4px; padding:7px 10px; min-height:46px; }
.slv-sp{ flex:1 1 auto; }
.slv-div{ width:1px; align-self:stretch; margin:5px 6px; background:var(--slv-line); }
.slv-grp{ display:flex; align-items:center; gap:3px; }
.slv-brand{ display:flex; align-items:center; flex:none; padding:0 4px 0 2px; }
.slv-brand svg{ width:24px; height:24px; display:block; filter:drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
/* Web only: the brand mark doubles as a "back to dashboard" link, so it's bigger + clickable. */
.slv-brand-web{ cursor:pointer; gap:8px; padding:2px 10px 2px 4px; border-radius:9px; }
.slv-brand-web:hover{ background:var(--slv-hover); }
.slv-brand-web svg{ width:27px; height:27px; }
.slv-brand-label{ font-size:14px; font-weight:700; letter-spacing:-.01em; color:var(--slv-ink); }

/* ---- buttons ------------------------------------------------------------- */
.slv-btn{
  all:unset; box-sizing:border-box; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px;
  height:32px; padding:0 11px; border-radius:8px;
  color:var(--slv-ink); font-size:13px; font-weight:550; line-height:1;
  white-space:nowrap; user-select:none;
  transition:background .12s, color .12s, filter .12s;
}
.slv-btn.slv-icon{ padding:0 8px; }
.slv-btn svg{ width:18px; height:18px; display:block; flex:none; }
.slv-btn:hover{ background:var(--slv-hover); }
.slv-btn:active{ background:var(--slv-active); }
.slv-btn:focus-visible{ outline:2px solid var(--slv-accent); outline-offset:1px; }
.slv-btn[aria-pressed="true"]{ background:var(--slv-press-bg); color:var(--slv-press-ink); }
.slv-btn[disabled]{ opacity:.4; cursor:default; }

/* ---- navigate counter ---------------------------------------------------- */
.slv-count{ display:inline-flex; align-items:center; gap:3px; height:30px; padding:0 8px;
  border-radius:8px; background:var(--slv-soft); font-size:13px; font-weight:600; }
#slv-cur{ all:unset; width:2.4ch; text-align:center; color:var(--slv-ink); font:inherit; border-radius:4px; }
#slv-cur:focus{ background:var(--slv-active); outline:none; }
#slv-total{ color:var(--slv-dim); }

/* ---- zoom ---------------------------------------------------------------- */
#slv-zoom{ display:flex; align-items:center; gap:1px; height:30px; padding:0 3px;
  border-radius:8px; background:var(--slv-soft); }
#slv-zoom .slv-btn{ height:26px; padding:0 6px; }
#slv-zlevel{ min-width:44px; text-align:center; font-size:12px; font-weight:600; color:var(--slv-dim); }

/* ---- export dropdown ----------------------------------------------------- */
#slv-file-menu{
  position:fixed; z-index:2147483647; min-width:172px; display:none;
  background:var(--slv-bg-solid); border:1px solid var(--slv-line); border-radius:10px;
  box-shadow:0 18px 50px -16px rgba(0,0,0,.82); padding:6px;
}
#slv-file-menu.slv-open{ display:block; }
#slv-file-menu .slv-item{ all:unset; display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 10px; border-radius:7px; font-size:13px; color:var(--slv-ink); cursor:pointer; }
#slv-file-menu .slv-item:hover{ background:var(--slv-hover); }
#slv-file-menu .slv-item[hidden]{ display:none; }
#slv-file-menu .slv-item.slv-off{ opacity:.4; cursor:not-allowed; }
#slv-file-menu .slv-item.slv-off:hover{ background:none; }
#slv-file-menu .slv-item svg{ width:16px; height:16px; color:var(--slv-dim); flex:none; }
.slv-menu-div{ height:1px; margin:5px 6px; background:var(--slv-line); }
/* Present button while presenting → a "Stop" affordance */
#slv-present.slv-present-on{ background:color-mix(in srgb, #e5484d 28%, transparent); color:#fff; }
/* Presenting: this is a presentation, so ALL chrome is gone — ribbon, navigator, pulldown handle,
   the editor inspector / grips / selection overlay / theme studio. The deck owns the screen. */
body.slv-presenting #slv-bar, body.slv-presenting #slv-thumbs, body.slv-presenting #slv-handle,
body.slv-presenting #slv-bstrip, body.slv-presenting #slv-chat,
body.slv-presenting .sl-insp, body.slv-presenting .sl-grip, body.slv-presenting .sl-edit-overlay,
body.slv-presenting .sl-studio, body.slv-presenting .sl-mpanel, body.slv-presenting .sl-cpop{ display:none !important; }
body.slv-presenting{ --slaide--dock-left:0px !important; --slaide--dock-right:0px !important;
  --slaide--dock-top:0px !important; --slaide--dock-bottom:0px !important; --slv-bar-h:0px !important; cursor:none; }
/* monitor picker dropdown (only when >1 display) */
#slv-mon-menu{ position:fixed; z-index:2147483647; min-width:190px; display:none;
  background:var(--slv-bg-solid); border:1px solid var(--slv-line); border-radius:10px;
  box-shadow:0 18px 50px -16px rgba(0,0,0,.82); padding:6px; }
#slv-mon-menu.slv-open{ display:block; }
#slv-mon-menu .slv-item{ all:unset; display:flex; align-items:center; gap:9px; width:100%;
  padding:8px 10px; border-radius:7px; font-size:12.5px; color:var(--slv-ink); cursor:pointer; }
#slv-mon-menu .slv-item:hover{ background:var(--slv-hover); }
#slv-mon-menu .slv-item svg{ width:16px; height:16px; color:var(--slv-dim); flex:none; }
#slv-present-caret{ padding:0 7px; }

/* ---- reveal handle (peeks when the bar is hidden) ------------------------ */
#slv-handle{
  position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:2147483646;
  display:flex; align-items:center; justify-content:center;
  width:48px; height:18px; border-radius:0 0 11px 11px;
  background:var(--slv-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--slv-line); border-top:none; color:var(--slv-dim); cursor:pointer;
  transition:opacity .18s, transform .18s;
}
#slv-handle svg{ width:18px; height:10px; }
#slv-handle:hover{ color:var(--slv-ink); }
body.slv-shown #slv-handle, body.slv-pinned #slv-handle{ opacity:0; pointer-events:none; transform:translateX(-50%) translateY(-100%); }

/* ---- thumbnail navigator (left drawer) ----------------------------------- */
#slv-thumbs{
  position:fixed; top:0; left:0; bottom:0; z-index:2147483645; width:196px;
  background:var(--slv-bg); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-right:1px solid var(--slv-line); box-shadow:18px 0 50px -28px rgba(0,0,0,.8);
  transform:translateX(-110%); transition:transform .2s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; color:var(--slv-ink);
}
#slv-thumbs.slv-open{ transform:none; }
#slv-thumbs-head{ padding:14px 16px 8px; font-size:11px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--slv-dim); transition:padding-top .18s ease; }
body.slv-shown #slv-thumbs-head, body.slv-pinned #slv-thumbs-head{ padding-top:calc(var(--slv-bar-h, 52px) + 12px); }
#slv-thumbs-list{ flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 12px 18px; display:flex; flex-direction:column; gap:11px; }
/* thin, unobtrusive scrollbars (Chromium + standard) for the viewer chrome */
#slv-thumbs-list, #slv-file-menu, #slv-notes{ scrollbar-width:thin; scrollbar-color:var(--slv-scroll) transparent; }
.slv-scroll::-webkit-scrollbar, #slv-thumbs-list::-webkit-scrollbar, #slv-file-menu::-webkit-scrollbar{ width:8px; height:8px; }
#slv-thumbs-list::-webkit-scrollbar-track, #slv-file-menu::-webkit-scrollbar-track{ background:transparent; }
#slv-thumbs-list::-webkit-scrollbar-thumb, #slv-file-menu::-webkit-scrollbar-thumb{ background:var(--slv-scroll); border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
#slv-thumbs-list::-webkit-scrollbar-thumb:hover, #slv-file-menu::-webkit-scrollbar-thumb:hover{ background:var(--slv-scroll-hover); background-clip:padding-box; }
#slv-thumbs-list::-webkit-scrollbar-corner{ background:transparent; }
.slv-thumb{ all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; border-radius:8px; padding:3px; }
.slv-thumb-frame{ position:relative; overflow:hidden; border-radius:6px; border:1px solid var(--slv-line);
  background:var(--slv-thumb-bg); flex:none; box-shadow:0 4px 12px -6px rgba(0,0,0,.6); }
.slv-thumb-box{ position:relative; transform-origin:0 0; }
/* Thumbnails are navigate-only previews. They're clones of editable slides, so in edit mode they
   would otherwise inherit contenteditable + the shapes' pointer-events/cursor:move + selectable
   text. Make the whole preview inert so the only action is the thumbnail button → go to slide. */
.slv-thumb-frame, .slv-thumb-frame *{ pointer-events:none !important; -webkit-user-select:none !important; user-select:none !important; }
.slv-thumb-n{ font-size:11px; font-weight:600; color:var(--slv-dim); }
.slv-thumb:hover .slv-thumb-frame{ border-color:var(--slv-active); }
.slv-thumb-active .slv-thumb-frame{ border-color:var(--slv-accent); box-shadow:0 0 0 2px var(--slv-accent); }
.slv-thumb-active .slv-thumb-n{ color:var(--slv-ink); }

/* ---- bottom thumbnail strip --------------------------------------------- */
#slv-bstrip{
  position:fixed; left:0; right:0; bottom:0; z-index:2147483644;
  height:var(--slv-bstrip-h, 110px); display:none;
  background:var(--slv-bg); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-top:1px solid var(--slv-line);
}
body.slv-bstrip-on #slv-bstrip{ display:flex; }
#slv-bstrip-bar{
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--slv-accent),#6FA8DC);
  background-size:200% 100%;
  opacity:0;transition:opacity .2s;
}
#slv-bstrip-bar.slv-active{opacity:1;animation:slv-sweep 1.5s ease-in-out infinite;}
#slv-bstrip-bar.slv-done{opacity:0;}
@keyframes slv-sweep{0%{background-position:100% 0}100%{background-position:-100% 0}}
#slv-bstrip-list{
  flex:1; display:flex; align-items:center; gap:12px; padding:8px 16px;
  overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; scrollbar-color:var(--slv-scroll) transparent;
}
.slv-bthumb{ all:unset; cursor:pointer; flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; }
.slv-bthumb-frame{ position:relative; overflow:hidden; border-radius:5px;
  border:2px solid var(--slv-line); background:var(--slv-thumb-bg);
  box-shadow:0 2px 8px -4px rgba(0,0,0,.5); transition:border-color .15s; }
.slv-bthumb-frame, .slv-bthumb-frame *{ pointer-events:none !important; -webkit-user-select:none !important; user-select:none !important; }
.slv-bthumb-box{ position:relative; transform-origin:0 0; }
.slv-bthumb:hover .slv-bthumb-frame{ border-color:var(--slv-active); }
.slv-bthumb-active .slv-bthumb-frame{ border-color:var(--slv-accent); box-shadow:0 0 0 2px var(--slv-accent); }
.slv-bthumb-n{ font-size:10px; font-weight:600; color:var(--slv-dim); }

/* ---- AI chat panel (left drawer, hosted tier) --------------------------- */
#slv-chat{
  position:fixed; top:0; left:0; bottom:0; z-index:2147483644; width:340px;
  background:var(--slv-bg); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-right:1px solid var(--slv-line); box-shadow:18px 0 50px -28px rgba(0,0,0,.8);
  transform:translateX(-110%); transition:transform .2s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; color:var(--slv-ink);
}
#slv-chat.slv-open{ transform:none; }
#slv-chat-head{ padding:14px 16px 8px; font-size:11px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--slv-dim); transition:padding-top .18s ease; }
body.slv-shown #slv-chat-head, body.slv-pinned #slv-chat-head{ padding-top:calc(var(--slv-bar-h, 52px) + 12px); }
#slv-chat-msgs{ flex:1; overflow-y:auto; padding:8px 14px; display:flex; flex-direction:column; gap:10px;
  scrollbar-width:thin; scrollbar-color:var(--slv-scroll) transparent; }
.slv-cmsg{ padding:9px 13px; border-radius:12px; font-size:13px; line-height:1.5; max-width:90%; word-wrap:break-word; }
.slv-cmsg-user{ align-self:flex-end; background:color-mix(in srgb, var(--slv-accent) 18%, transparent); }
.slv-cmsg-ai{ align-self:flex-start; background:var(--slv-soft); }
.slv-cmsg-ai code{ background:var(--slv-hover); padding:1px 5px; border-radius:4px; font-size:12px; }
.slv-cmsg-status{ align-self:center; font-size:12px; color:var(--slv-dim); font-style:italic; }
#slv-chat-compose{ padding:10px; border-top:1px solid var(--slv-line); }
#slv-chat-wrap{ display:flex; border:1px solid var(--slv-line); border-radius:10px;
  background:var(--slv-soft); overflow:hidden; transition:border-color .15s; }
#slv-chat-wrap:focus-within{ border-color:var(--slv-accent); }
#slv-chat-input{ flex:1; border:none; background:transparent; color:var(--slv-ink);
  font:inherit; font-size:13px; padding:9px 11px; outline:none; resize:none;
  min-height:36px; max-height:120px; }
#slv-chat-send{ all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
  width:34px; color:var(--slv-dim); }
#slv-chat-send:hover{ color:var(--slv-accent); }

@media (prefers-reduced-motion: reduce){
  #slv-bar, #slv-thumbs, #slv-handle, #slv-bstrip, #slv-chat{ transition:none; }
}
@media print{ #slv-bar, #slv-thumbs, #slv-handle, #slv-bstrip, #slv-chat, #slv-file-menu{ display:none !important; } }

/* ---- edit mode: a tabbed ribbon (tab strip + command band) --------------- */
#slv-edit-grp[hidden], #slv-edit-div[hidden], #slv-chat-btn[hidden], #slv-thumbs-btn[hidden]{ display:none; }
#slv-tabs, #slv-band{ max-height:0; overflow:hidden; opacity:0;
  transition:max-height .2s ease, opacity .14s ease, padding .2s ease; }
body.slv-editmode #slv-tabs{ max-height:44px; opacity:1; }
body.slv-editmode #slv-band{ max-height:72px; opacity:1; }

/* tab strip: mode switch · tabs · Save */
#slv-tabs{ display:flex; align-items:center; gap:10px; padding:0 12px; border-top:1px solid transparent; }
body.slv-editmode #slv-tabs{ padding:5px 12px; border-top-color:var(--slv-line); }
.slv-tablist{ display:flex; align-items:center; gap:2px; }
.slv-tab{ all:unset; cursor:pointer; height:28px; padding:0 13px; border-radius:7px; position:relative;
  font-size:12.5px; font-weight:550; color:var(--slv-dim); transition:color .12s, background .12s; }
.slv-tab:hover{ color:var(--slv-ink); background:var(--slv-soft); }
.slv-tab[aria-selected="true"]{ color:var(--slv-ink); }
.slv-tab[aria-selected="true"]::after{ content:""; position:absolute; left:11px; right:11px; bottom:-5px;
  height:2px; border-radius:2px; background:linear-gradient(90deg,var(--slv-accent),#6FA8DC); }

/* mode switch (Slides | Theme) */
.slv-modeswitch{ display:flex; background:var(--slv-soft); border:1px solid var(--slv-line); border-radius:9px; padding:2px; gap:2px; }
.slv-mode{ height:28px; padding:0 12px; font-size:12px; font-weight:550; gap:6px; border-radius:7px; }
.slv-mode svg{ width:16px; height:16px; }
.slv-mode[aria-pressed="true"]{ background:var(--slv-accent); color:#fff; }
.slv-mode[aria-pressed="true"] svg{ color:#fff; }
.slv-tabsep{ width:1px; height:20px; background:var(--slv-line); margin:0 2px; }

/* command band: each group has a small caption ON TOP (light, not bold), buttons below */
#slv-band{ display:flex; align-items:stretch; padding:0 12px; background:var(--slv-soft); }
body.slv-editmode #slv-band{ padding:6px 12px 8px; border-top:1px solid var(--slv-line); }
.slv-bandtab{ display:none; align-items:stretch; }
.slv-bandtab.slv-active{ display:flex; }
#slv-band .slv-gcol{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:0 12px; }
#slv-band .slv-glabel{ font-size:9.5px; font-weight:500; letter-spacing:.04em; text-transform:uppercase;
  color:var(--slv-dim); line-height:1; opacity:.8; padding-left:9px; }
#slv-band .slv-grp{ display:flex; align-items:center; gap:4px; }
#slv-band .slv-div{ width:1px; align-self:stretch; margin:3px 2px; background:var(--slv-line); opacity:.55; }

/* theme mode: hide the slide tabs + band, keep the mode switch + Save */
body.sl-studio-on .slv-tablist, body.sl-studio-on .slv-tabsep{ display:none; }
body.sl-studio-on #slv-band{ max-height:0 !important; opacity:0; padding:0 12px; border-top-color:transparent; }

.slv-save{ background:var(--slv-accent); color:#fff; font-weight:600; padding:0 16px; }
.slv-save:hover{ filter:brightness(1.08); }
/* Pro sign-in control: CTA when locked, subtle "signed-in" badge (accent dot) when unlocked. */
#slv-account{ padding:0 12px; font-weight:600; }
#slv-account.slv-cta{ background:var(--slv-accent); color:#fff; }
#slv-account.slv-cta:hover{ filter:brightness(1.08); }
#slv-account.slv-signed{ color:var(--slv-accent); }
#slv-account.slv-signed::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--slv-accent); display:inline-block; margin-right:2px; }

/* ---- responsive: collapse secondary controls into a burger on small screens -------- */
#slv-burger{ display:none; }
#slv-more-menu{
  position:fixed; z-index:2147483647; min-width:220px; max-width:calc(100vw - 16px); display:none;
  background:var(--slv-bg-solid); border:1px solid var(--slv-line); border-radius:12px;
  box-shadow:0 18px 50px -16px rgba(0,0,0,.45); padding:6px;
}
#slv-more-menu.slv-open{ display:block; }

          <button class="slv-btn slv-icon" data-act="front" title="Bring to front"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,138.34a8,8,0,0,1-11.32,11.32L136,91.31V224a8,8,0,0,1-16,0V91.31L61.66,149.66a8,8,0,0,1-11.32-11.32l72-72a8,8,0,0,1,11.32,0ZM216,32H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg></button>
          <button class="slv-btn slv-icon" data-act="back" title="Send to back"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M50.34,117.66a8,8,0,0,1,11.32-11.32L120,164.69V32a8,8,0,0,1,16,0V164.69l58.34-58.35a8,8,0,0,1,11.32,11.32l-72,72a8,8,0,0,1-11.32,0ZM216,208H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg></button>

<script>
(function(){
  function ipcSend(m){ try{ window.ipc.postMessage(m); }catch(e){} }
  function S(){ return window.slaide || null; }          // post-rename public API
  function q(s){ return document.querySelector(s); }
  var body = document.body, bar = q('#slv-bar');

  // ---- host adapter --------------------------------------------------------
  // Every side-effecting action (persist prefs, present, open/reload, insert image, save
  // edits, export) is routed through window.__SLV_HOST__ so one ribbon drives two backends:
  // the native desktop viewer (Rust over window.ipc — the DEFAULT) and the hosted web editor
  // (the engine-service over fetch, selected only when window.__SLV_WEB__ is present). The
  // desktop adapter emits the EXACT ipc messages used before this seam existed, so when
  // __SLV_WEB__ is absent the viewer behaves byte-for-byte as it always has.
  var WEB  = window.__SLV_WEB__  || null;   // { apiBase, sessionId, internal?, token?, secret?, signal? }
  var CAPS = window.__SLV_CAPS__ || null;   // injected by the engine render (edit/persist/import/export/aiAgent)
  // AbortController signal for cleanup: the web shell sets __SLV_WEB__.signal before re-executing
  // the ribbon on a deck switch, so all global listeners added here get removed cleanly.
  var signal = (WEB && WEB.signal) || undefined;
  // Editable when the native viewer says so (desktop) OR the web caps grant `edit`. Desktop
  // parity: with __SLV_WEB__ absent this is exactly !!window.__SLV_EDITABLE__.
  var EDITABLE = !!window.__SLV_EDITABLE__ || !!(WEB && CAPS && CAPS.edit);

  function dl(blob, name){
    try{
      var u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = name || 'download'; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 0);
    }catch(e){}
  }

  function makeDesktopHost(){
    // Identity layer over the original window.ipc messages — desktop parity.
    return {
      web: false,
      loadPrefs:    function(){ return window.__SLV_PREFS__ || {}; },
      savePrefs:    function(p){ ipcSend('prefs:' + JSON.stringify(p)); },
      present:      function(){ ipcSend('present'); },
      open:         function(){ ipcSend('open'); },
      reload:       function(){ ipcSend('reload'); },
      requestImage: function(){ ipcSend('insert-image'); },
      saveEdits:    function(edits){ ipcSend('save:' + JSON.stringify(edits)); },
      exportAs:     function(kind){ ipcSend(kind); }
    };
  }

  function makeWebHost(cfg){
    // Drives the same-origin engine-service proxy. apiBase is the `/v1` base; the editable
    // render, __SLV_WEB__ and __SLV_CAPS__ are all served same-origin so fetch carries the
    // session cookie and the document is never a cross-origin iframe.
    var base = String(cfg.apiBase || '').replace(/\/+$/, '');
    var sid  = cfg.sessionId;
    function url(p){ return base + '/sessions/' + encodeURIComponent(sid) + p; }
    function hdr(extra){
      var h = extra || {};
      if(cfg.internal && cfg.secret) h['X-Slaide-Internal'] = cfg.secret;
      if(cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
      return h;
    }
    function fail(e){ try{ console.error('[slaide:web]', e); }catch(_){} }

    // Present: the Fullscreen API on this document; mirror the button via fullscreenchange.
    //
    // Entering fullscreen is ASYNC (requestFullscreen() resolves — and the 'fullscreenchange' event
    // fires — only once the browser has actually completed the transition, at least a frame later).
    // __slvSetPresenting was only ever called from that event, so waiting for it left a real,
    // visible gap where the deck was already full-screen but the editor's selection ring hadn't been
    // dropped yet (_editApi.setEdit(false) lives inside __slvSetPresenting) — the reported "blue ring
    // visible at the start of presenting, gone a moment later" bug. Flip presenting state + drop edit
    // mode SYNCHRONOUSLY, in the same tick as the click, then let the fullscreenchange handler just
    // reconfirm it (a no-op) once the real transition lands; if the browser ends up refusing/
    // cancelling the request, undo the eager flip so the UI doesn't claim to be presenting when it
    // isn't.
    function present(){
      try{
        if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); }
        else {
          var el = document.documentElement;
          if(window.__slvSetPresenting) window.__slvSetPresenting(true);
          if(el.requestFullscreen){
            var p = el.requestFullscreen();
            if(p && typeof p.catch === 'function'){
              p.catch(function(){ if(!document.fullscreenElement && window.__slvSetPresenting) window.__slvSetPresenting(false); });
            }
          }
        }
      }catch(e){ fail(e); }
    }
    document.addEventListener('fullscreenchange', function(){
      if(window.__slvSetPresenting) window.__slvSetPresenting(!!document.fullscreenElement);
    }, {signal:signal});

    // Insert→image on web: hand off to the SPA shell, which uploads to the org's CLOUD asset store and
    // inserts a resolvable /api/slaide/assets/<id>/raw URL. (The engine's session-asset store returns a
    // relative 'assets/…' path that 404s against the app document, so it isn't used here.)
    function requestImage(){ try{ window.postMessage({ type:'slaide:insert-image' }, '*'); }catch(e){ fail(e); } }

    // Live WYSIWYG re-render for structural edits (layout/background/variant): the engine re-maps
    // slots/backgrounds, which the client can't preview alone. Patch the session (no disk save) with
    // ALL pending edits, then reload the render — preserving the current slide via the hash.
    window.__slvLiveRerender = function(edits){
      try{ var i = (window.slaide && window.slaide.index); if(i != null) location.hash = '#' + (i + 1); }catch(e){}
      if(!edits || !edits.length){ location.reload(); return; }
      fetch(url('/patch'), { method:'POST', credentials:'same-origin',
        headers: hdr({ 'content-type':'application/json' }), body: JSON.stringify({ patches: edits }) })
        .then(function(r){ if(!r.ok) throw new Error('patch failed: ' + r.status); location.reload(); })
        .catch(fail);
    };

    function saveEdits(edits){
      if(!edits || !edits.length) return;
      var persist = !!(CAPS && CAPS.persist);
      fetch(url('/patch'), { method:'POST', credentials:'same-origin',
        headers: hdr({ 'content-type':'application/json' }),
        body: JSON.stringify({ patches: edits }) })
        .then(function(r){ if(!r.ok) throw new Error('patch failed: ' + r.status);
          return persist ? fetch(url('/save'), { method:'POST', credentials:'same-origin', headers: hdr() }) : null; })
        .then(function(r){
          if(r){ if(!r.ok) throw new Error('save failed: ' + r.status); return r.blob().then(function(b){ dl(b, 'deck.slaidec'); }); }
        })
        .then(function(){ var s = S(); if(s && s.clearEdits) s.clearEdits(); })
        .catch(fail);
    }

    function exportAs(kind){
      // kind is the ribbon's data-exp value: export-html | export-pdf | export-pptx | export-key | export-slaidec.
      if(kind === 'export-html'){
        fetch(url('/render'), { credentials:'same-origin', headers: hdr() })
          .then(function(r){ if(!r.ok) throw new Error('render failed: ' + r.status); return r.blob(); })
          .then(function(b){ dl(b, 'deck.html'); }).catch(fail);
        return;
      }
      var k = kind === 'export-pdf' ? 'pdf' : kind === 'export-slaidec' ? 'slaidec'
        : kind === 'export-pptx' ? 'pptx' : kind === 'export-key' ? 'key' : null;
      if(!k) return;
      function sessionExport(){
        fetch(url('/export/' + k), { method:'POST', credentials:'same-origin',
          headers: hdr({ 'content-type':'application/json' }), body:'{}' })
          .then(function(r){ if(!r.ok) throw new Error('export failed: ' + r.status); return r.blob(); })
          .then(function(b){ dl(b, 'deck.' + k); }).catch(fail);
      }
      // Hosted app: pdf/pptx/png go through the backend's stateless project export (hook is
      // installed by the web-editor shell; absent on desktop). The hook resolves false for
      // demo/no-project (fall back to the session route), but an HTTP ERROR fails the export —
      // falling back to the session route on error would silently produce imageless files.
      if((k === 'pdf' || k === 'pptx' || k === 'png') && window.__slvHostedExport){
        Promise.resolve().then(function(){ return window.__slvHostedExport(k); })
          .then(function(handled){ if(!handled) sessionExport(); })
          .catch(fail);
        return;
      }
      sessionExport();
    }

    return {
      web: true,
      loadPrefs:    function(){ try{ return JSON.parse(localStorage.getItem('slv:prefs') || '{}') || {}; }catch(e){ return {}; } },
      savePrefs:    function(p){ try{ localStorage.setItem('slv:prefs', JSON.stringify(p)); }catch(e){} },
      present:      present,
      open:         function(){ location.reload(); },     // re-fetch the editable render
      reload:       function(){ location.reload(); },
      requestImage: requestImage,
      saveEdits:    saveEdits,
      exportAs:     exportAs
    };
  }

  var HOST = window.__SLV_HOST__ = (WEB ? makeWebHost(WEB) : makeDesktopHost());
  // Native: relay this window's slide moves to Rust, which mirrors them onto the audience window
  // (the second screen) when presenting on another display. Web uses BroadcastChannel instead.
  if(!WEB){
    window.__slvNav = function(c, s){ ipcSend('nav:' + c + '.' + s); };
    window.__slvBlank = function(k){ ipcSend('blank:' + (k || '')); };   // b/w blanks the audience (projector)
    // Native live re-render for structural edits (layout/background/variant): the engine must re-map
    // slots/backgrounds, which an attribute flip can't preview. The desktop has no session to patch,
    // so patch = save — persist the edits to the .slaide file; Rust re-renders and reloads (the
    // current slide is preserved via the URL hash the runtime keeps in sync). Mirrors the web host's
    // __slvLiveRerender so the editor's structural dropdowns work identically on both.
    window.__slvLiveRerender = function(edits){ if(edits && edits.length) HOST.saveEdits(edits); };
  }

  // Hosted web audience window: opened via window.open(...&slvview=present...) by openAudience()
  // below. runtime.ts's AM_AUDIENCE detects the same query param and adds body.slv-presenting
  // (hiding all chrome via CSS); here we only need HOST.present() to mean "stop presenting" —
  // Fullscreen was entered by this window's own gesture (see the pill below), so exiting it +
  // closing the window is the whole story. No BroadcastChannel wiring needed: runtime.ts already
  // subscribes every window (audience included) to 'slaide:present:'+location.pathname.
  var IS_WEB_AUDIENCE = !!WEB && /[?&]slvview=present([&#]|$)/.test(location.search);
  if(IS_WEB_AUDIENCE){
    HOST.present = function(){
      try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
      try{ window.close(); }catch(e){}
    };
    // Esc in fullscreen is consumed by the BROWSER (exits fullscreen before any keydown fires) —
    // so leaving fullscreen IS the close signal for the projector, same as Esc on desktop.
    document.addEventListener('fullscreenchange', function(){
      if(!document.fullscreenElement){ try{ window.close(); }catch(e){} }
    }, {signal:signal});
    // Projector parity with the native viewer: no edit affordances, ever (belt to main.ts's
    // braces — the editable render auto-enables edit mode after boot).
    setTimeout(function(){ var s = S(); if(s && s.edit){ try{ s.edit(false); }catch(e){} } }, 800);
    // Normally this window is ALREADY fullscreen — the opener passes 'popup,fullscreen' to
    // window.open (Chromium 121+ w/ window-management permission). If the browser ignored the
    // feature, the FIRST gesture anywhere in this window (a click, any key) enters fullscreen —
    // no dedicated button needed.
    ['pointerdown','keydown'].forEach(function(t){
      document.addEventListener(t, function(){
        if(!document.fullscreenElement){ try{ document.documentElement.requestFullscreen(); }catch(e){} }
      }, {once:true, capture:true, signal:signal});
    });
    // Last-ditch visible affordance for browsers where neither path fired.
    setTimeout(function(){
      if(document.fullscreenElement) return;               // instant-fullscreen path worked
      if(document.getElementById('slv-fs-pill')) return;   // guard against double-insert
      var pill = document.createElement('button');
      pill.id = 'slv-fs-pill';
      pill.type = 'button';
      pill.textContent = 'Click for fullscreen';
      pill.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2147483647;'
        + 'padding:9px 16px;border:none;border-radius:999px;background:rgba(20,20,26,.82);color:#fff;'
        + 'font:600 13px system-ui;cursor:pointer;';
      pill.addEventListener('click', function(){
        try{ document.documentElement.requestFullscreen(); }catch(e){}
      });
      document.addEventListener('fullscreenchange', function(){
        if(document.fullscreenElement) pill.remove();
      }, {signal:signal});
      document.body.appendChild(pill);
    }, 600);
  }
  // Web, and NOT the audience window itself: this window may open + manage an audience window on
  // a chosen screen. Desktop keeps its existing __SLV_MONITORS__/IPC path untouched.
  var CAN_HOST_AUDIENCE = !!WEB && !IS_WEB_AUDIENCE;

  // Capability gating. The engine render injects window.__SLV_CAPS__ (web);
  // desktop uses __SLV_EDITABLE__ + __SLV_LICENSE__ instead.
  function applyCaps(){
    var c = CAPS || {};
    if(WEB){
      if(!c.persist){ var sv = q('#slv-save'); if(sv) sv.style.display = 'none'; var ms = q('#slv-mi-save'); if(ms) ms.hidden = true; }
      if(!c.import){ var ii = q('#slv-insert-grp [data-ins="image"]'); if(ii) ii.style.display = 'none'; }
      if(c.persist){ var lb = q('#slv-ins-library'); if(lb) lb.style.display = ''; }
      if(!c.export){ Array.prototype.forEach.call(document.querySelectorAll('#slv-file-menu [data-exp]'), function(e){ e.hidden = true; }); }
    }
    // AI chat button: WEB/hosted only. Native has no chat backend wired yet, so it stays hidden
    // there — gate on WEB, not just the aiAgent cap (a hosted-licensed desktop user carries the
    // aiAgent capability locally, which must NOT reveal the non-functional native drawer).
    // The web-editor's main.ts reveals + rewires this button.
    if(WEB && c.aiAgent){
      var chatBtn = q('#slv-chat-btn');
      if(chatBtn){ chatBtn.hidden = false; chatBtn.addEventListener('click', function(){ setChatOpen(!chatOpen); }); }
    }
  }

  // PowerPoint / Keynote export. Desktop runs them through Node + slaide; the web host
  // through the engine-service. Native Keynote needs macOS, so it is grayed out elsewhere
  // (web reports it via CAPS.keynote, desktop via the injected __SLV_MAC__ flag).
  function applyExportTargets(){
    var key = q('#slv-file-menu [data-exp="export-key"]');
    var isMac = WEB ? !!(CAPS && CAPS.keynote) : !!window.__SLV_MAC__;
    if(key && !isMac){
      key.classList.add('slv-off');
      key.setAttribute('aria-disabled', 'true');
      key.setAttribute('title', 'Keynote export needs macOS');
    }
  }

  // ---- reveal / hide / pin ------------------------------------------------
  var pinned = false, hideTimer = null, exportOpen = false;
  var thumbsBuilt = false, thumbsDirty = false;

  // ---- persisted chrome prefs (docked toolbar + slides panel) -------------
  // Loaded/persisted through the host adapter: native viewer → window.__SLV_PREFS__ + IPC;
  // web editor → localStorage. Both default ON when absent (plain web build / first run).
  var PREFS = HOST.loadPrefs();
  // ---- chrome theme ------------------------------------------------------
  // Native: saved pref (light default, dark toggle). Hosted: follow the WEBSITE's appearance,
  // injected as window.__SLV_WEB__.theme — the site owns it, so we don't offer a divergent toggle.
  var docEl = document.documentElement;
  var HOSTED_THEME = WEB ? ((WEB.theme === 'dark') ? 'dark' : 'light') : null;
  function curTheme(){ return docEl.getAttribute('data-slv-theme') === 'dark' ? 'dark' : 'light'; }
  function applyTheme(t){
    if(t === 'dark') docEl.setAttribute('data-slv-theme', 'dark');
    else docEl.removeAttribute('data-slv-theme');
    var lbl = q('#slv-mi-theme-label');                 // the menu item offers the OTHER mode
    if(lbl) lbl.textContent = (t === 'dark') ? 'Light theme' : 'Dark theme';
  }
  applyTheme(HOSTED_THEME || (PREFS.theme === 'dark' ? 'dark' : 'light'));
  if(WEB){ var _themeItem = q('#slv-mi-theme'); if(_themeItem) _themeItem.hidden = true; }   // hosted: website owns appearance
  function savePrefs(){
    HOST.savePrefs({
      toolbar_pinned: pinned,
      slides_visible: q('#slv-thumbs').classList.contains('slv-open'),
      theme: curTheme()
    });
  }

    var TW = 126, sc = TW / CW, TH = Math.round(TW * CH / CW);
    var real = stage.querySelectorAll(':scope > .sl-slide');
    Array.prototype.forEach.call(real, function(slide, i){
      var item = document.createElement('button'); item.className = 'slv-thumb'; item.title = 'Slide ' + (i+1);
      var frame = document.createElement('div'); frame.className = 'slv-thumb-frame'; frame.style.width = TW + 'px'; frame.style.height = TH + 'px';
      var box = document.createElement('div'); box.className = 'slv-thumb-box'; box.style.width = CW + 'px'; box.style.height = CH + 'px'; box.style.transform = 'scale(' + sc + ')';
      var c = slide.cloneNode(true);
      c.classList.remove('sl-active');
      c.style.visibility = 'visible'; c.style.opacity = '1';
      c.querySelectorAll('.sl-build').forEach(function(e){ e.classList.add('sl-shown'); });           // final built state
      c.querySelectorAll('[id]').forEach(function(e){ e.removeAttribute('id'); });                    // no duplicate ids
      c.querySelectorAll('[data-morph]').forEach(function(e){ e.removeAttribute('data-morph'); });    // no view-transition clashes
      box.appendChild(c); frame.appendChild(box);
      var n = document.createElement('span'); n.className = 'slv-thumb-n'; n.textContent = (i+1);
      item.appendChild(frame); item.appendChild(n);
      item.addEventListener('click', function(){ var s = S(); if(s) s.show(i); });
      list.appendChild(item);
    });
    thumbsBuilt = true; thumbsDirty = false;
  }
  function highlightThumb(idx){
    var list = q('#slv-thumbs-list'); if(!list) return;
    Array.prototype.forEach.call(list.children, function(el, i){ el.classList.toggle('slv-thumb-active', i === idx); });
    if(q('#slv-thumbs').classList.contains('slv-open')){ var a = list.children[idx]; if(a && a.scrollIntoView) a.scrollIntoView({ block:'nearest' }); }
  }
  // Docking (not overlay): reserve a left gutter via --slaide--dock-left and ask the deck
  // to recompute its fit so the slide shrinks + recenters beside the panel.
  var DOCK_W = 196;
  function setDock(open){
    document.documentElement.style.setProperty('--slaide--dock-left', open ? (DOCK_W + 'px') : '0px');
    var s = S(); if(s && s.relayout) s.relayout();
  }
  var thumbsBtn = q('#slv-thumbs-btn');
  function setThumbs(open){
    var d = q('#slv-thumbs');
    if(open && (!thumbsBuilt || thumbsDirty)) buildThumbs();
    d.classList.toggle('slv-open', open);
    thumbsBtn.setAttribute('aria-pressed', open ? 'true' : 'false');
    setDock(open);
    if(open){ var s = S(); highlightThumb(s ? s.index : 0); }
  }
  thumbsBtn.addEventListener('click', function(){
    setThumbs(!q('#slv-thumbs').classList.contains('slv-open'));
    savePrefs();
  });
  // keep the stage centered across the panel's slide-in/out animation
  q('#slv-thumbs').addEventListener('transitionend', function(e){
    if(e.propertyName === 'transform'){ var s = S(); if(s && s.relayout) s.relayout(); }
  });

  // ---- bottom thumbnail strip -----------------------------------------------
  var bstripBuilt = false, bstripDirty = false;
  function buildBstrip(){
    var list = q('#slv-bstrip-list'), stage = q('.sl-stage');
    if(!list || !stage) return;
    list.innerHTML = '';
    var CW = parseFloat(stage.dataset.w) || 1280, CH = parseFloat(stage.dataset.h) || 720;
    var TW = 100, sc = TW / CW, TH = Math.round(TW * CH / CW);
    var slides = stage.querySelectorAll(':scope > .sl-slide');
    Array.prototype.forEach.call(slides, function(slide, i){
      var btn = document.createElement('button'); btn.className = 'slv-bthumb'; btn.title = 'Slide ' + (i+1);
      var frame = document.createElement('div'); frame.className = 'slv-bthumb-frame'; frame.style.width = TW + 'px'; frame.style.height = TH + 'px';
      var box = document.createElement('div'); box.className = 'slv-bthumb-box'; box.style.width = CW + 'px'; box.style.height = CH + 'px'; box.style.transform = 'scale(' + sc + ')';
      var c = slide.cloneNode(true);
      c.classList.remove('sl-active'); c.style.visibility = 'visible'; c.style.opacity = '1';
      c.querySelectorAll('.sl-build').forEach(function(e){ e.classList.add('sl-shown'); });
      c.querySelectorAll('[id]').forEach(function(e){ e.removeAttribute('id'); });
      c.querySelectorAll('[data-morph]').forEach(function(e){ e.removeAttribute('data-morph'); });
      box.appendChild(c); frame.appendChild(box);
      var n = document.createElement('span'); n.className = 'slv-bthumb-n'; n.textContent = String(i+1);
      frame.appendChild(n);
      btn.appendChild(frame);
      btn.addEventListener('click', function(){ var s = S(); if(s) s.show(i); });
      list.appendChild(btn);
    });
    bstripBuilt = true; bstripDirty = false;
  }
  function highlightBstrip(idx){
    var list = q('#slv-bstrip-list'); if(!list) return;
    Array.prototype.forEach.call(list.children, function(el, i){ el.classList.toggle('slv-bthumb-active', i === idx); });
    var a = list.children[idx]; if(a) a.scrollIntoView({ inline:'nearest', behavior:'smooth' });
  }
  var BSTRIP_H = 110;
  function setBstrip(open){
    body.classList.toggle('slv-bstrip-on', open);
    if(open && (!bstripBuilt || bstripDirty)) buildBstrip();
    document.documentElement.style.setProperty('--slaide--dock-bottom', open ? (BSTRIP_H + 'px') : '0px');
    var s = S(); if(s && s.relayout) s.relayout();
    if(open) highlightBstrip(s ? s.index : 0);
  }

  // ---- AI chat panel toggle -------------------------------------------------
  var chatOpen = false;
  var CHAT_W = 340;
  function setChatOpen(open){
    chatOpen = open;
    var panel = q('#slv-chat'); if(panel) panel.classList.toggle('slv-open', open);
    var btn = q('#slv-chat-btn'); if(btn) btn.setAttribute('aria-pressed', open ? 'true' : 'false');
    if(!q('#slv-thumbs').classList.contains('slv-open')){
      document.documentElement.style.setProperty('--slaide--dock-left', open ? (CHAT_W + 'px') : '0px');
      var s = S(); if(s && s.relayout) s.relayout();
    }
  }

  // ---- escape: close the file menu (deck handles its own panels) -----------
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(exportOpen){ setMenu(false); return; }
  }, {signal:signal});

  // ---- edit (only when the Pro engine reported editing is available) -------
  // window.__SLV_EDITABLE__ is injected by the viewer when the engine's meta says so;
  // with the OSS engine it is absent, so the Edit affordance never appears.
  if(EDITABLE){
    var editGrp = q('#slv-edit-grp'), editDiv = q('#slv-edit-div');
    if(editGrp) editGrp.hidden = false;
    if(editDiv) editDiv.hidden = false;
    // Editor navigates via the bottom filmstrip, not the left slide navigator — hide its toggle
    // (matches the web editor, which has no left SLIDES sidebar in edit mode). Use the `hidden`
    // attr like the sibling chat button (see the [hidden]{display:none} rule near the top).
    var thumbsBtnEl = q('#slv-thumbs-btn'); if(thumbsBtnEl) thumbsBtnEl.hidden = true;
    var editBtn = q('#slv-edit');
    function editing(){ var s = S(); return !!(s && s.editing && s.editing()); }
    // Editor-mode switch: Slides (element editor) <-> Theme (master editor). Theme opens the
    // master panel and frees the left dock by closing the slide navigator.
    var modeSlide = q('#slv-mode-slide'), modeMaster = q('#slv-mode-master');
    var thumbsBeforeMaster = false, bstripBeforeMaster = false;
    function setMode(master){
      if(modeSlide) modeSlide.setAttribute('aria-pressed', master ? 'false' : 'true');
      if(modeMaster) modeMaster.setAttribute('aria-pressed', master ? 'true' : 'false');
      var s = S();
      if(master){
        thumbsBeforeMaster = q('#slv-thumbs').classList.contains('slv-open');
        bstripBeforeMaster = body.classList.contains('slv-bstrip-on');
        setThumbs(false);
        setBstrip(false);
      } else {
        if(thumbsBeforeMaster) setThumbs(true);
        if(bstripBeforeMaster) setBstrip(true);
      }
      if(s && s.editMaster) s.editMaster(master);         // editMaster is now authoritative over the live DOM
    }
    if(modeSlide) modeSlide.addEventListener('click', function(){ setMode(false); });
    if(modeMaster) modeMaster.addEventListener('click', function(){ setMode(true); });
    function setEdit(on){
      var s = S(); if(!s || !s.edit) return;
      s.edit(on);
      if(on && s.__editor){ s.__editor.requestImage = function(){ HOST.requestImage(); }; }
      if(!on) setMode(false);                             // leaving edit mode also closes the theme panel
      body.classList.toggle('slv-editmode', on);
      editBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      if(!WEB){
        setBstrip(on);
        if(on) setThumbs(false);
      }
      show(); setTimeout(syncBarH, 220);    // editing bar changes the bar height → republish it
    }
    editBtn.addEventListener('click', function(){ setEdit(!editing()); });
    _editApi = { editing: editing, setEdit: setEdit };   // let Present drop/restore edit mode
    // Save: collect edits and hand them to Rust to persist + reload. Shared by the
    // editing-bar Save button and the File menu's Save item.
    function doSave(){
      var s = S(); if(!s) return;
      var edits = s.collectEdits ? s.collectEdits() : [];
      if(!edits.length) return;                        // nothing changed
      HOST.saveEdits(edits);                           // desktop: ipc → Rust persists+reloads; web: POST /patch (+/save)
    }
    saveHandler = doSave;
    var miSave = q('#slv-mi-save'); if(miSave) miSave.hidden = false;   // reveal Save in the File menu
    q('#slv-save').addEventListener('click', function(){
      var s = S(); var edits = (s && s.collectEdits) ? s.collectEdits() : [];
      if(!edits.length){ setEdit(false); return; }     // nothing to save → just leave edit mode
      doSave();
    });
    // Insert group → the editor's insertion API. Text/image place immediately; the
    // shapes arm a draw tool (crosshair, then click-drag on the slide to size).
    Array.prototype.forEach.call(q('#slv-insert-grp').querySelectorAll('[data-ins]'), function(b){
      b.addEventListener('click', function(){
        var s = S(); if(!s || !s.__editor) return;
        var k = b.getAttribute('data-ins');
        if(k === 'text') s.__editor.insertText();
        else if(k === 'image'){ if(s.__editor.requestImage) s.__editor.requestImage(); }
        else if(k === 'library'){ try{ (WEB ? window : window.parent).postMessage({ type:'slaide:open-gallery' }, '*'); }catch(e){} }
        else s.__editor.insertShape(k);
      });
    });
    // Ribbon tabs: switch which command band is visible (Home / Insert / Arrange).
    var tabsEl = q('#slv-tabs'), bandEl = q('#slv-band');
    if(tabsEl && bandEl){
      Array.prototype.forEach.call(tabsEl.querySelectorAll('.slv-tab'), function(t){
        t.addEventListener('click', function(){
          var name = t.getAttribute('data-tab');
          Array.prototype.forEach.call(tabsEl.querySelectorAll('.slv-tab'), function(x){ x.setAttribute('aria-selected', x===t ? 'true' : 'false'); });
          Array.prototype.forEach.call(bandEl.querySelectorAll('.slv-bandtab'), function(bt){ bt.classList.toggle('slv-active', bt.getAttribute('data-tab')===name); });
          syncBarH();
        });
      });
    }
    // Arrange / Element / History actions → the editor API (act on the current selection).
    Array.prototype.forEach.call(q('#slv-band').querySelectorAll('[data-act]'), function(b){
      b.addEventListener('click', function(){
        var s = S(), ed = s && s.__editor; var a = b.getAttribute('data-act');
        if(a === 'undo'){ if(s && s.undo) s.undo(); return; }
        if(a === 'redo'){ if(s && s.redo) s.redo(); return; }
        if(!ed) return;
        if(a === 'centerH') ed.align('h');
        else if(a === 'centerV') ed.align('v');
        else if(a === 'front') ed.order('front');
        else if(a === 'back') ed.order('back');
        else if(a === 'duplicate') ed.duplicate();
        else if(a === 'delete') ed.deleteSelected();
      });
    });
    // Editing is the default mode in the editor build: enter it once the deck is ready.
    // (Esc is left to the editor for deselect; toggle edit off with the Edit button.)
    (function enterEdit(){ var s = S(); if(s && s.edit){ if(!editing()) setEdit(true); } else setTimeout(enterEdit, 30); })();
  }

  // ---- init ---------------------------------------------------------------
  syncNav(); syncZoom(); applyCaps(); applyExportTargets();
  // Apply persisted chrome state (both default ON). slides_visible opens the navigator;
  // toolbar_pinned keeps the bar docked open — otherwise briefly reveal so it's discoverable.
  if(!EDITABLE && PREFS.slides_visible !== false) setThumbs(true);
  if(PREFS.toolbar_pinned !== false){ setPinned(true); }
  else { show(); setTimeout(scheduleHide, 1500); }
  // The deck's layout may settle after our init; once loaded, re-apply the dock fit.
  window.addEventListener('load', function(){
    var s = S(); if(!s || !s.relayout) return;
    if(q('#slv-thumbs').classList.contains('slv-open')) setDock(true);
    s.relayout();
  }, {signal:signal});
})();
</script>
