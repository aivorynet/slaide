name: Release

# On a version tag (the GitLab mirror pushes `v*` here), this:
#   1. builds the native viewer + lean engine on Linux, macOS, Windows as a cross-platform
#      compile smoke test (the artifacts are not shipped);
#   2. publishes the `@aivorynet/slaide` package to npm with provenance.
# Run it manually (workflow_dispatch) to test the build; manual runs skip npm.
#
# The GitHub *Release* (the downloadable binaries) is published by the private build pipeline,
# which produces the official Pro-capable, signed binaries — see the monorepo's .gitlab-ci.yml
# `publish:dist` job. This workflow intentionally does NOT create a release (no collision).
#
# OIDC trusted publishing handles npm auth (no NPM_TOKEN needed).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x64,    archive: tar.gz }
          - { os: macos-latest,   target: macos-arm64,  archive: tar.gz }
          - { os: windows-latest, target: windows-x64,  archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      # The native viewer uses tao + wry; on Linux that needs WebKitGTK + GTK.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev

      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Build engine + viewer
        run: npm run build:viewer

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p out/slaide
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp viewer/target/release/slaide-view.exe out/slaide/
            cp viewer/vendor/slaide-engine.exe out/slaide/ 2>/dev/null || cp viewer/vendor/slaide-engine out/slaide/slaide-engine.exe
          else
            cp viewer/target/release/slaide-view out/slaide/
            cp viewer/vendor/slaide-engine out/slaide/
          fi
          cp -r themes out/slaide/
          cp LICENSE README.md out/slaide/ 2>/dev/null || true
          cd out
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "slaide-${{ matrix.target }}.zip" slaide >/dev/null
          else
            tar czf "slaide-${{ matrix.target }}.tar.gz" slaide
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum slaide-${{ matrix.target }}.* > "slaide-${{ matrix.target }}.sha256"
          else
            shasum -a 256 slaide-${{ matrix.target }}.* > "slaide-${{ matrix.target }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: slaide-${{ matrix.target }}
          path: out/slaide-${{ matrix.target }}.*

  # The official, signed, Pro-capable GitHub Release is published by the private .gitlab-ci.yml
  # `publish:dist` job (it has the closed `pro/` sources + the signing key). This workflow only
  # smoke-builds the OSS tree and publishes the npm package.

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write   # OIDC trusted publishing + provenance (no token needed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publish if this version is new
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@aivorynet/slaide@$V" version >/dev/null 2>&1; then
            echo "@aivorynet/slaide@$V already published, skipping."
          else
            npm publish --provenance --access public
          fi
