# yaml-language-server: $schema=https://getslaide.com/schema/v1.json
schema: slaide/1
name: marbury
description: >
  Marbury & Stone — a premium, traditional law-firm identity. Oxford navy and
  ink on bone paper, a single restrained brass accent, an authoritative
  old-style serif, fine hairline rules and letterspaced labels. Gravitas, not
  gimmicks.

canvas: { aspect: "16:9", width: 1920, height: 1080 }

# ── Typography ───────────────────────────────────────────────────────────────
# Cormorant Garamond  — authoritative transitional display serif (headings, stat)
# EB Garamond         — quiet, readable old-style serif (body, quotes)
# Spectral SC / mono  — letterspaced small label voice (eyebrows, chrome)
fonts:
  display: { family: "Cormorant Garamond", provider: google, weights: [500, 600, 700] }
  serif:   { family: "EB Garamond",        provider: google, weights: [400, 500, 600] }
  body:    { family: "EB Garamond",        provider: google, weights: [400, 500, 600] }
  label:   { family: "Spectral",           provider: google, weights: [400, 500, 600] }
  mono:    { family: "Spectral",           provider: google, weights: [400, 500] }

typeScale:
  base: "30px"
  ratio: 1.2
  steps:
    stat:    "190px"
    hero:    "120px"
    h1:      "92px"
    h2:      "64px"
    h3:      "44px"
    h4:      "34px"
    lead:    "40px"
    body:    "30px"
    caption: "23px"
    label:   "21px"
    small:   "18px"

# ── Colour ───────────────────────────────────────────────────────────────────
colors:
  palette:
    ink:      "#0E1722"   # near-black, very dark navy
    navy:     "#16243A"   # oxford / deep counsel navy
    navy2:    "#1E3050"   # raised navy panel
    slate:    "#5C6A7C"   # muted secondary on light
    slateL:   "#9FB0C4"   # muted secondary on dark
    bone:     "#F4EFE6"   # warm ivory paper
    bone2:    "#EAE3D4"   # secondary paper / hairline-on-light fill
    paperLine: "#D8CFBC"  # hairline on bone
    brass:    "#A6852E"   # restrained gold / brass accent
    brassL:   "#C9A646"   # lighter brass for dark grounds
    oxblood:  "#6E2230"   # deep reserve accent (used sparingly)
    white:    "#FBF8F2"
  roles:
    background: "{palette.bone}"
    surface:    "{palette.bone2}"
    text:       "{palette.ink}"
    heading:    "{palette.navy}"
    muted:      "{palette.slate}"
    accent:     "{palette.brass}"
    rule:       "{palette.paperLine}"

# Dark variant — flips roles for navy/ink sections so default slots stay legible.
variants:
  dark:
    roles:
      background: "{palette.navy}"
      surface:    "{palette.navy2}"
      text:       "{palette.bone}"
      heading:    "{palette.white}"
      muted:      "{palette.slateL}"
      accent:     "{palette.brassL}"
      rule:       "{palette.brassL}"

# ── Backgrounds ──────────────────────────────────────────────────────────────
backgrounds:
  paper:    { type: solid, color: "{palette.bone}" }
  paperAlt: { type: solid, color: "{palette.bone2}" }
  navy:    { type: gradient, stops: ["#16243A 0%", "#101B2C 100%"], angle: 160 }
  ink:     { type: gradient, stops: ["#101B2C 0%", "#0B1320 100%"], angle: 160 }

# ── Chrome (engraved running heads) ──────────────────────────────────────────
tokens:
  "--slide-padding": "150px"
  "--chrome-pad": "150px"
  "--chrome-top": "70px"
  "--chrome-bottom": "70px"
  "--chrome-size": "19px"
  "--chrome-foot-size": "19px"
  "--logo-h": "30px"
  "--code-bg": "#101B2C"
  "--code-fg": "#F4EFE6"
  "--code-inline-bg": "#EAE3D4"
  "--code-pad": "1.1em 1.3em"
  "--code-radius": "2px"

transitions: { default: fade, duration: 600 }

chrome:
  header:
    left: "MARBURY &amp; STONE"
    right: "{{slideTitle}}"
  footer:
    left: "COUNSELORS AT LAW"
    center: "{{footer}}"
    right: "{{pagePadded}} · {{totalPadded}}"

# ── Layouts ──────────────────────────────────────────────────────────────────
layouts:

  # 1. Cover — symmetric, monogram rule above, firm name centred, est. line below
  cover:
    background: navy
    variant: dark
    chrome: false
    align: center
    padding: "150px 200px"
    areas:
      - "eyebrow"
      - "title"
      - "rule"
      - "subtitle"
      - "meta"
    rows: "auto auto auto auto auto"
    gap: "1.6em"
    slots:
      eyebrow:  { type: caption, style: { font: label, size: label, color: accent, align: center, justify: center, transform: uppercase, weight: "500", leading: "1.2" } }
      title:    { type: title,   style: { font: display, size: h1, color: heading, align: center, justify: center, weight: "600", leading: "1.0", maxw: "20ch" } }
      rule:     { type: body,    style: { font: label, size: caption, color: accent, align: center, justify: center, leading: "1" } }
      subtitle: { type: subtitle,style: { font: serif, size: lead, color: muted, align: center, justify: center, italic: true, weight: "400", leading: "1.3", maxw: "30ch" } }
      meta:     { type: caption, style: { font: label, size: small, color: muted, align: center, justify: center, transform: uppercase, weight: "500", leading: "1.4" } }

  # 2. Statement — top eyebrow + big serif headline + supporting line. The
  #    workhorse "argument" slide. Dark or light per slide via variant.
  statement:
    background: paper
    align: center
    padding: "150px 220px"
    areas:
      - "eyebrow"
      - "title"
      - "rule"
      - "lead"
    rows: "auto auto auto auto"
    gap: "1.3em"
    slots:
      eyebrow: { type: caption, style: { font: label, size: label, color: accent, align: center, justify: center, transform: uppercase, weight: "600", leading: "1.2" } }
      title:   { type: title,   style: { font: display, size: h1, color: heading, align: center, justify: center, weight: "600", leading: "1.04", maxw: "22ch" } }
      rule:    { type: body,    style: { font: label, size: caption, color: accent, align: center, justify: center, leading: "1" } }
      lead:    { type: body,    style: { font: serif, size: lead, color: text, align: center, justify: center, weight: "400", leading: "1.4", maxw: "44ch" } }

  # 3. Practice — eyebrow + title, then a 3-up grid of dignified cards.
  practice:
    background: paper
    align: start
    padding: "120px 150px 130px"
    areas:
      - "eyebrow eyebrow eyebrow"
      - "title title title"
      - "c1 c2 c3"
    rows: "auto auto 1fr"
    cols: "1fr 1fr 1fr"
    gap: "2.4em"
    slots:
      eyebrow: { type: caption, style: { font: label, size: label, color: accent, transform: uppercase, weight: "600", leading: "1.2" } }
      title:   { type: title,   style: { font: display, size: h2, color: heading, weight: "600", leading: "1.05", maxw: "26ch" } }
      c1: { type: body, style: { font: serif, size: caption, color: text, box: surface, leading: "1.45" } }
      c2: { type: body, style: { font: serif, size: caption, color: text, box: surface, leading: "1.45" } }
      c3: { type: body, style: { font: serif, size: caption, color: text, box: surface, leading: "1.45" } }

  # 4. Record — dark track-record slide: eyebrow + title, then three stat columns.
  record:
    background: navy
    variant: dark
    align: start
    padding: "120px 150px 140px"
    areas:
      - "eyebrow eyebrow eyebrow"
      - "title title title"
      - "s1 s2 s3"
    rows: "auto auto 1fr"
    cols: "1fr 1fr 1fr"
    gap: "2.6em"
    slots:
      eyebrow: { type: caption, style: { font: label, size: label, color: accent, transform: uppercase, weight: "600", leading: "1.2" } }
      title:   { type: title,   style: { font: display, size: h2, color: heading, weight: "600", leading: "1.05", maxw: "26ch" } }
      s1: { type: body, style: { font: serif, size: body, color: muted, align: center, valign: center, leading: "1.35" } }
      s2: { type: body, style: { font: serif, size: body, color: muted, align: center, valign: center, leading: "1.35" } }
      s3: { type: body, style: { font: serif, size: body, color: muted, align: center, valign: center, leading: "1.35" } }

  # 5. Quote — testimonial / representative matter, centred large serif italic.
  quote:
    background: paperAlt
    align: center
    padding: "150px 240px"
    areas:
      - "mark"
      - "quote"
      - "rule"
      - "attribution"
    rows: "auto auto auto auto"
    gap: "1.2em"
    slots:
      mark:        { type: caption, style: { font: display, size: hero, color: accent, align: center, justify: center, weight: "700", leading: "0.6" } }
      quote:       { type: quote,   style: { font: display, size: h2, color: heading, align: center, justify: center, italic: true, weight: "500", leading: "1.2", maxw: "30ch" } }
      rule:        { type: body,    style: { font: label, size: caption, color: accent, align: center, justify: center, leading: "1" } }
      attribution: { type: caption, style: { font: label, size: caption, color: muted, align: center, justify: center, transform: uppercase, weight: "500", leading: "1.4" } }

  # 6. Closing / contact — dark, centred, formal call to retain counsel.
  closing:
    background: ink
    variant: dark
    chrome: footer
    align: center
    padding: "150px 200px"
    areas:
      - "eyebrow"
      - "title"
      - "rule"
      - "lead"
      - "contact"
    rows: "auto auto auto auto auto"
    gap: "1.5em"
    slots:
      eyebrow: { type: caption, style: { font: label, size: label, color: accent, align: center, justify: center, transform: uppercase, weight: "600", leading: "1.2" } }
      title:   { type: title,   style: { font: display, size: h1, color: heading, align: center, justify: center, weight: "600", leading: "1.04", maxw: "22ch" } }
      rule:    { type: body,    style: { font: label, size: caption, color: accent, align: center, justify: center, leading: "1" } }
      lead:    { type: body,    style: { font: serif, size: lead, color: text, align: center, justify: center, italic: true, weight: "400", leading: "1.4", maxw: "40ch" } }
      contact: { type: caption, style: { font: label, size: caption, color: muted, align: center, justify: center, transform: uppercase, weight: "500", leading: "1.6" } }
